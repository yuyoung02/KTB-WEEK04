name: Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64]

    defaults:
      run:
        working-directory: springboot

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            springboot/**/*.gradle*
            springboot/**/gradle-wrapper.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        env:
          JWT_SECRET: test-jwt-secret-for-github-actions-ci
        run: ./gradlew clean test --no-daemon

      - name: Build backend
        env:
          JWT_SECRET: test-jwt-secret-for-github-actions-ci
        run: ./gradlew bootJar --no-daemon

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Update backend source
        run: |
          cd /home/ubuntu/ballpark/KTB-WEEK04
          git checkout main
          git pull origin main

      - name: Rebuild backend container
        run: |
          cd /home/ubuntu/ballpark
          docker compose build backend
          docker compose up -d --no-deps backend

      - name: Check backend container
        run: |
          cd /home/ubuntu/ballpark
          docker compose ps backend
      
          for i in {1..10}; do
            if curl --fail --silent http://localhost/api/posts > /dev/null; then
              echo "Backend deployment successful"
              exit 0
            fi
      
            echo "Backend is starting... ($i/10)"
            sleep 5
          done
      
          echo "Backend health check failed"
          docker compose logs --tail=100 backend
          exit 1