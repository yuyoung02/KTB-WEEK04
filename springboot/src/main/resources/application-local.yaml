spring:
  datasource:
    url: jdbc:h2:file:~/h2db/testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: always

# 로컬 실행 전용 JWT 키 (운영 환경은 JWT_SECRET 사용)
jwt:
  secret: local-development-jwt-secret-key-over-32-bytes

# 로컬에서 실행된 SQL과 바인딩 값을 콘솔에 출력
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: false
      logging: slf4j
      log-format: "SQL %(executionTime)ms | %(sqlSingleLine)"
      exclude-categories: info,debug,result,resultset,batch,commit,rollback
